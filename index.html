<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Ruma Kumari — Premium Creator Hub</title>
    <meta name="description" content="Exclusive premium photo and video content hub with instant UPI dynamic QR checkout, zero-login access, and secure token delivery." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.svg" />
    <meta name="theme-color" content="#fdf2f8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="Ruma Kumari — Premium Creator Hub" />
    <meta property="og:description" content="Exclusive premium photo and video content hub with instant UPI dynamic QR checkout, zero-login access, and secure token delivery." />
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Ruma Kumari Official" />
    
    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ruma Kumari | Official VIP Content" />
    <meta name="twitter:description" content="Exclusive VIP videos and photos with instant UPI unlock." />

    <!-- Performance Preconnects for Assets, Fonts, Cloudinary & Firebase -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
    <link rel="dns-prefetch" href="https://images.unsplash.com">
    <link rel="dns-prefetch" href="https://res.cloudinary.com">
    <link rel="dns-prefetch" href="https://firestore.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Netlify Drawer, Badge & Collaboration Toolbar Suppressor -->
    <script>
      (function() {
        try {
          window.NETLIFY_DRAWER_DISABLED = true;
          window.ntl_drawer_state = 'hidden';
          if (typeof sessionStorage !== 'undefined') {
            sessionStorage.setItem('ntl-drawer-state', 'hidden');
          }
        } catch (e) {}

        function stripNetlifyOverlays() {
          try {
            var selectors = [
              'netlify-drawer',
              'netlify-badge',
              '#netlify-drawer',
              '#netlify-badge',
              '#ntl-drawer',
              '.netlify-drawer',
              '.netlify-badge',
              '.ntl-drawer',
              '[data-netlify-drawer]',
              '[data-netlify-badge]',
              'iframe[src*="netlify.com"]',
              'iframe[src*="netlify.app"]',
              'iframe[src*="cdp"]',
              'iframe[src*="drawer"]',
              'iframe[src*="badge"]',
              'iframe[title*="Netlify" i]',
              'script[src*="netlify.com/drawer"]'
            ];
            for (var s = 0; s < selectors.length; s++) {
              var els = document.querySelectorAll(selectors[s]);
              for (var i = 0; i < els.length; i++) {
                var el = els[i];
                if (el && el.parentNode) {
                  el.parentNode.removeChild(el);
                }
              }
            }

            var bodyFrames = document.querySelectorAll('body > iframe');
            for (var j = 0; j < bodyFrames.length; j++) {
              var frame = bodyFrames[j];
              var src = (frame.getAttribute('src') || '').toLowerCase();
              if (src.indexOf('netlify') !== -1 || src.indexOf('cdp') !== -1 || src === '' || src.indexOf('badge') !== -1) {
                if (frame.parentNode) frame.parentNode.removeChild(frame);
              }
            }
          } catch (err) {}
        }

        if (typeof MutationObserver !== 'undefined') {
          var observerTimer = null;
          var observer = new MutationObserver(function() {
            if (observerTimer) return;
            observerTimer = setTimeout(function() {
              observerTimer = null;
              stripNetlifyOverlays();
            }, 600);
          });
          observer.observe(document.documentElement, { childList: true, subtree: true });
          setTimeout(function() {
            try { observer.disconnect(); } catch (e) {}
          }, 4000);
        }

        document.addEventListener('DOMContentLoaded', stripNetlifyOverlays);
        window.addEventListener('load', stripNetlifyOverlays);
        setTimeout(stripNetlifyOverlays, 800);
        setTimeout(stripNetlifyOverlays, 2500);
      })();
    </script>
  </head>
  <body class="bg-[#fdf2f8] text-purple-950 antialiased selection:bg-pink-500 selection:text-white min-h-screen overflow-x-clip">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
